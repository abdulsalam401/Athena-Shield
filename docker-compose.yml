version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - athena-net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
    networks:
      - athena-net

  dashboard:
    build: ./dashboard
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - athena-net

networks:
  athena-net:
    driver: bridge

volumes:
  redis_data:
